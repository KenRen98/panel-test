# 你的分支 Docker 自动打包工作流
# 基于原版 pterodactyl-china/panel 的 .github/workflows/docker.yaml 改：
#   - 触发分支：release/v1.15.0.0（push 即自动打包，可手动触发）
#   - 推送仓库：Docker Hub，镜像 kenren98/mlsg:panel
#   - 登录变量：沿用你 pal 那个 action 的 DOCKER_USERNAME / DOCKER_TOKEN
#   - 构建方式：用 ./Dockerfile（两阶段），Buildx 只打 linux/amd64（x86），gha 缓存
name: Panel Image Build and Push

on:
  push:
    branches: [ release/v1.15.0.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 Docker Hub（变量名和你 pal 那个 action 保持一致）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 用仓库根目录的 ./Dockerfile 构建并推送（两阶段：node 编前端 -> php8.3-fpm 运行环境）
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: kenren98/mlsg:panel
          cache-from: type=gha
          cache-to: type=gha,mode=max
